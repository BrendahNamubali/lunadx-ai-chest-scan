version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: lunadx_db
    environment:
      POSTGRES_DB: lunadx
      POSTGRES_USER: lunadx
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunadx -d lunadx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: lunadx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend API
  backend:
    build: .
    container_name: lunadx_backend
    environment:
      DATABASE_URL: postgresql://lunadx:password@db:5432/lunadx
      GROQ_API_KEY: ${GROQ_API_KEY:-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}
      MODEL_PATH: /app/models/chexnet.pth
      SIMULATION_MODE: "false"
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: ${SUPABASE_URL:-https://yykqafwozfpropcbuqjm.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DEFAULT_SUPER_ADMIN_EMAIL: ${DEFAULT_SUPER_ADMIN_EMAIL:-admin@lunadx.com}
      DEFAULT_SUPER_ADMIN_PASSWORD: ${DEFAULT_SUPER_ADMIN_PASSWORD:-admin123}
      DEFAULT_SUPER_ADMIN_FULL_NAME: ${DEFAULT_SUPER_ADMIN_FULL_NAME:-LunaDX Administrator}
      IOTEC_CLIENT_ID: ${IOTEC_CLIENT_ID:-pay-01a0b4d5-9ee8-7489-a2a0-917d7e7dc30d}
      IOTEC_CLIENT_SECRET: ${IOTEC_CLIENT_SECRET:-}
      IOTEC_WALLET_ID: ${IOTEC_WALLET_ID:-01a0b4d5-9f92-70cf-aa3d-f09ae93aff07}
      IOTEC_GRANT_TYPE: ${IOTEC_GRANT_TYPE:-client_credentials}
      IOTEC_AUTH_URL: ${IOTEC_AUTH_URL:-https://id.iotec.io/connect/token}
      IOTEC_API_BASE: ${IOTEC_API_BASE:-https://pay.iotec.io/api}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_data:/app/models
      - log_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lunadx_frontend
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://yykqafwozfpropcbuqjm.supabase.co}
      VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-yykqafwozfpropcbuqjm}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_ExSGmHmFwNDOOdd_c-RaLw_dzKY8kH6}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  model_data:
    driver: local
  log_data:
    driver: local

networks:
  default:
    name: lunadx_network
